<!DOCTYPE html>
<html class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dados Pessoais</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="d-flex flex-column h-100">
  <!-- NAVBAR - INICIO -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Dados Pessoais</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Mudar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Pessoas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/interesses/index.html">Interesses</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- NAVBAR - FIM -->

  <main class="container-lg flex-shrink-0">
    <h1 class="text-center">Pessoas cadastradas - Fetch API</h1>
    <div class="row justify-content-center">
      <table class="table table-striped">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Username</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="dados">
          <tr>
            <th>999</th>
            <td>Xpto Wxyz</td>
            <td>xpto</td>
            <td>xpto@email.com</td>
            <td>
              <div class="btn-group" role="group" aria-label="Ações">
                <a class="btn btn-primary" role="button">
                  <i class="fas fa-edit"></i> Alterar
                </a>
                <button type="button" class="btn btn-danger">
                  <i class="fas fa-trash-alt"></i> Excluir
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div>
        <a class="btn btn-lg btn-success" role="button" href="formulario.html">
          <i class="fas fa-plus-square"></i> Incluir novo
        </a>
      </div>
    </div>
  </main>

  <div>
    <div class="modal fade" id="modalExcluir" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
      aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel"><i class="fas fa-trash-alt"></i> Confirmar exclusão</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <p id="modalExcluirMsg">Confirma exclusão?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Não</button>
            <form id="modalExcluirForm" style="display: inline-block" method="post">
              <button type="submit" class="btn btn-danger">Sim</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER - INICIO -->
  <footer class="footer mt-auto py-3 bg-body-tertiary">
    <div class="container text-center">
      <span class="text-body-secondary">Exemplo Dados Pessoais</span>
    </div>
  </footer>
  <!-- FOOTER - FIM -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    function confirmarExclusao(id) {
      const confirmado = confirm('Confirma exclusão do ID ' + id + '?');
      if (confirmado) {
        // Implementa lógica para fetch ao endpoint do DELETE
        // Recarregadas dados da tela
        alert('Excluído');
      }
    }

    async function findAll() {
      try {
        const httpResp = await fetch('http://localhost:8080/api/pessoas');
        if (!httpResp.ok) {
           throw new Error(`Erro HTTP - status ${httpResp.status}`)
        }
        const dadosArray = await httpResp.json();

        // Limpar a tag <tbody id="dados">
        const elTbody = document.getElementById('dados');
        elTbody.innerHTML = '';

        for (const dadoPessoa of dadosArray.content) {
          const linhaTabela = `<tr>
            <th>${dadoPessoa.id}</th>
            <td>${dadoPessoa.nome}</td>
            <td>${dadoPessoa.username}</td>
            <td>${dadoPessoa.email}</td>
            <td>
              <div class="btn-group" role="group" aria-label="Ações">
              <a class="btn btn-primary" role="button"  href="formulario.html?id=${dadoPessoa.id}">
                <i class="fas fa-edit"></i> Alterar
              </a>
              <button type="button" class="btn btn-danger" onclick="confirmarExclusao(${dadoPessoa.id})">
                <i class="fas fa-trash-alt"></i> Excluir
              </button>
              </div>
            </td>
          </tr>`;
          elTbody.insertAdjacentHTML('beforeend', linhaTabela);
        }
      } catch (err) {
        alert('Erro na requisição - ' + err);
      }
    }

    findAll();

  </script>
</body>

</html>
