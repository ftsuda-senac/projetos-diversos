<!DOCTYPE html>
<html class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dados Pessoais</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
    integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="d-flex flex-column h-100">
  <!-- NAVBAR - INICIO -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Dados Pessoais</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Mudar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Pessoas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/interesses/index.html">Interesses</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- NAVBAR - FIM -->

  <div class="container-lg flex-shrink-0">
    <div class="row">
      <main class="col-lg-12">
        <h1 id="tituloInclusao" class="d-none mb-3">Incluir nova pessoa</h1>
        <h1 id="tituloAlteracao" class="d-none">Alterar pessoa</h1>
        <h2 id="pessoaId" class="d-none mb-3">ID: <strong></strong></h2>
        <form method="post" id="formDados" novalidate>
          <div class="row mb-3">
            <label for="txtUsername" class="col-sm-2 col-form-label">Username</label>
            <div class="col-sm-10">
              <input type="text" name="username" value="" id="txtUsername"
                placeholder="Preencha seu nome de usuário"
                class="form-control" 
                required maxlength="100" />
              <p class="invalid-feedback"></p>
              <p id="nomeAjuda" class="form-text">Digitar um nome de usuário sem acentuação, caracteres especiais (exceto - e _) e
                espaços em branco<br />Exemplos: fulano, ciclano-silva, teste123, teste_xpto</p>
            </div>
          </div>
          <div class="row mb-3">
            <label for="txtNome" class="col-sm-2 col-form-label">Nome</label>
            <div class="col-sm-10">
              <input type="text" name="nome" value="" id="txtNome"
                placeholder="Preencha o nome completo"
                class="form-control"
                required maxlength="100" />
              <p class="invalid-feedback"></p>
            </div>
          </div>
          <div class="row mb-3">
            <label for="txtDataNascimento" class="col-sm-2 col-form-label">Data de nascimento</label>
            <div class="col-sm-10">
              <input type="date" name="dataNascimento" value="" id="txtDataNascimento"
              class="form-control"
                maxlength="10" />
              <p class="invalid-feedback"></p>
            </div>
          </div>
          <div class="row mb-3">
            <label for="txtEmail" class="col-sm-2 col-form-label">E-mail</label>
            <div class="col-sm-10">
              <input type="email" name="email" value="" id="txtEmail"
                placeholder="E-mail válido"
                class="form-control"
                required maxlength="100"  />
              <p class="invalid-feedback"></p>
            </div>
          </div>
          <div class="row mb-3">
            <label for="txtTelefone" class="col-sm-2 col-form-label">Telefone</label>
            <div class="col-sm-10">
              <input type="text" name="telefone" value="" id="txtTelefone"
                placeholder="Telefone"
                class="form-control"
                maxlength="20"  />
              <p class="invalid-feedback"></p>
            </div>
          </div>

          <div class="row mb-3 campoSomenteInclusao">
            <label for="txtSenha" class="col-sm-2 col-form-label">Senha</label>
            <div class="col-sm-10">
              <input type="password" name="senha" value="" id="txtSenha"
                placeholder="Preencha sua senha"
                class="form-control"
                required minlength="8" />
              <p class="invalid-feedback"></p>
            </div>
          </div>
          <div class="row mb-3 campoSomenteInclusao">
            <label for="txtSenhaConfirmacao" class="col-sm-2 col-form-label">Repetir senha</label>
            <div class="col-sm-10">
              <input type="password" name="senhaConfirmacao" value="" id="txtSenhaConfirmacao"
                placeholder="Repita sua senha"
                class="form-control"
                minlength="8" />
              <p class="invalid-feedback"></p>
            </div>
          </div>
          <fieldset class="row mb-3">
            <legend class="col-sm-2 col-form-label pt-0">Interesses</legend>

            <!-- OBS: OPÇÕES ABAIXO DEVEM SER CARREGADOS VIA FETCH API -->
            <!-- ESTAO APRESENTADOS DIRETAMENTE NESTE HTML SOMENTE COMO EXEMPLO -->
            <div class="col-sm-10">
              <div id="opcoesInteresses">
                <div class="form-check form-check-inline">
                  <input type="checkbox" name="interessesIds" value="Java" id="interesse0"
                    class="form-check-input" />
                  <label for="interesse0" class="form-check-label">Java</label>
                </div>
                <div class="form-check form-check-inline">
                  <input type="checkbox" name="interessesIds" value="Javascript" id="interesse1"
                    class="form-check-input" />
                  <label for="interesse1" class="form-check-label">Javascript</label>
                </div>
              </div>
              <div class="invalid-feedback"></div>
            </div>
          </fieldset>

          <div class="row justify-content-center">
            <div class="col-md-3">
              <div class="d-grid">
                <a href="index.html" role="button" class="btn btn-outline-dark">Cancelar</a>
              </div>
            </div>
            <div class="col-md-3">
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Salvar</button>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <!-- FOOTER - INICIO -->
  <footer class="footer mt-auto py-3 bg-body-tertiary">
    <div class="container text-center">
      <span class="text-body-secondary">Exemplo Dados Pessoais</span>
    </div>
  </footer>
  <!-- FOOTER - FIM -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    // Carregar opções de interesses
    async function findAllInteresses() {
      try {
        const httpResp = await fetch('http://localhost:8080/api/interesses');
        if (!httpResp.ok) {
          throw new Error(`Erro HTTP - status ${httpResp.status}`)
        }
        const dadosArray = await httpResp.json();

        // Limpar a tag <div id="opcoesInteresses">
        const elOpcoesInteresses = document.getElementById('opcoesInteresses');
        elOpcoesInteresses.innerHTML = '';

        for (const interesse of dadosArray) {
          const idInput = `interesse${interesse.id}`;
          const opcaoInteresse = `<div class="form-check form-check-inline">
              <input type="checkbox" name="interessesIds" value="${interesse.id}" id="${idInput}" class="form-check-input" data-label="${interesse.nome}" />
              <label for="${idInput}" class="form-check-label">${interesse.nome}</label>
            </div>`;
          elOpcoesInteresses.insertAdjacentHTML('beforeend', opcaoInteresse);
        }
      } catch (err) {
        alert('Erro na requisição - ' + err);
      }
    }

    async function carregarPessoa(id) {
      try {
        const httpResp = await fetch(`http://localhost:8080/api/pessoas/${id}`);
        if (!httpResp.ok) {
          throw new Error(`Erro HTTP - status ${httpResp.status}`)
        }
        const dados = await httpResp.json();

        const form = document.getElementById('formDados');
        form.nome.value = dados.nome;
        form.username.value = dados.username;
        form.dataNascimento.value = dados.dataNascimento;
        form.email.value = dados.email;
        form.telefone.value = dados.telefone;

        for (const interesse of dados.interesses) {
          const inputChk = document.querySelector(`[name="interessesIds"][data-label="${interesse}"]`);
          if (inputChk) {
            inputChk.checked = true
          }
        }
      } catch (err) {
        alert('Erro na requisição - ' + err);
      }
    }

    function limparValidacao() {
      // Limpa mensagens de validação da requisição anterior
      const elInputs = document.querySelectorAll('.is-invalid');
      for (const elInput of elInputs) {
        elInput.classList.remove('is-invalid');
      }
      const elMensagens= document.querySelectorAll('.is-invalid + p');
      for (const elMensagem of elMensagens) {
        elMensagem.textContent = '';
      }
    }

    function mostrarErrosValidacao(erros) {
      for (const erro of erros) {
        const field = erro.field;
        const mensagem = erro.defaultMessage;

        const elInput = document.querySelector(`[name="${field}"]`);
        const elMensagem = document.querySelector(`[name="${field}"] + p`);

        elInput.classList.add('is-invalid');
        elMensagem.textContent = mensagem;
      }
    }

    // Verificar quais interesses foram selecionados
    function obterInteresses() {
      const interessesIds = [];
      const interessesChk = document.querySelectorAll('[name="interessesIds"]');
      for (const elChk of interessesChk) {
        if (elChk.checked) {
          interessesIds.push(+elChk.value); // + converte a string para number
        }
      }
      return interessesIds;
    }

    async function salvar(evt, id) {
      evt.preventDefault();

      const elFormulario = evt.target; // equivale a document.getElementById('formDados');

      limparValidacao();
      const interessesIds = obterInteresses();

      const dadosParaEnviar = id ? ({
        nome: elFormulario.nome.value,
        dataNascimento: elFormulario.dataNascimento.value,
        email: elFormulario.email.value,
        telefone: elFormulario.telefone.value,
        interessesIds: interessesIds
      }) : ({
        username: elFormulario.username.value,
        nome: elFormulario.nome.value,
        dataNascimento: elFormulario.dataNascimento.value,
        email: elFormulario.email.value,
        telefone: elFormulario.telefone.value,
        senha: elFormulario.senha.value,
        senhaConfirmacao: elFormulario.senhaConfirmacao.value,
        interessesIds: interessesIds
      });
      console.log(JSON.stringify(dadosParaEnviar));

      const url = id ? `http://localhost:8080/api/pessoas/${id}`: 'http://localhost:8080/api/pessoas';
      const method = id ? 'PUT' : 'POST';

      try {
        const httpResp = await fetch(url, {
          method: method,
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify(dadosParaEnviar)
        });
        if (!httpResp.ok) {
          if (httpResp.status === 400) {
            const erros = await httpResp.json();
            mostrarErrosValidacao(erros.errors);
          } else {
            throw new Error(`Erro HTTP - status ${httpResp.status}`)
          }
          return;
        }
        alert('Sucesso');
        window.location.href = 'index.html';
      } catch(err) {
        alert('Erro na requisição - ' + err);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {

      // Lógica para limitar a data de nascimento ao dia atual
      const dataLocal = new Date();
      const ano = dataLocal.getFullYear();
      // O mês começa em 0, por isso somamos 1. O padStart garante o formato '01' em vez de '1'
      const mes = String(dataLocal.getMonth() + 1).padStart(2, '0');
      const dia = String(dataLocal.getDate()).padStart(2, '0');

      const hojeLocal = `${ano}-${mes}-${dia}`;

      // Agora o 'max' será exatamente o dia de hoje no fuso do usuário
      document.getElementById('txtDataNascimento').setAttribute('max', hojeLocal);

      await findAllInteresses();

      // Se informar ID pessoa na query string da URL, carrega os dados da pessoa
      // https://stackoverflow.com/a/901144
      const urlParams = new URLSearchParams(window.location.search);
      const pessoaId = urlParams.get('id');
      if (pessoaId) {
        await carregarPessoa(pessoaId);
        // Desabilitar campo username
        const usernameInput = document.getElementById('txtUsername');
        usernameInput.setAttribute('readonly', true);
        usernameInput.setAttribute('disabled', true);
        document.getElementById('nomeAjuda').classList.add('d-none');
        document.querySelectorAll('.campoSomenteInclusao').forEach(el => el.classList.add('d-none'));
        document.getElementById('tituloAlteracao').classList.remove('d-none');
        document.getElementById('pessoaId').classList.remove('d-none');
        document.querySelector('#pessoaId > strong').textContent = pessoaId;

        document.getElementById('formDados').addEventListener('submit', async (evt) => {
          await salvar(evt, idPessoa);
        });
      } else {
        document.getElementById('tituloInclusao').classList.remove('d-none');
        document.getElementById('formDados').addEventListener('submit', async (evt) => {
          await salvar(evt, null)
        });
      }
    });

  </script>
</body>

</html>
